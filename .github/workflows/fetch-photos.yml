# Fetches licensed Wikimedia Commons photos for the attention. runs when Wikimedia throttles the cloud's
# shared address (it 429'd every fresh photo for over an hour on 2026-11-24 and two posts were lost).
# A run pushes fetch/requests/<id>.txt (one upload.wikimedia.org URL per line); this job downloads each
# with the same identifying User-Agent, saves it as fetch/files/<sha256(url)[:20]>, and pushes.
# Only upload.wikimedia.org is fetched. The licence check stays in the attention-daily code.
name: fetch photos
on:
  push:
    branches: [main]
    paths: ["fetch/requests/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-photos
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the requested photos
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, time, urllib.request
          UA = ("attention-daily-slides/1.2 (https://www.instagram.com/attention.daily/; "
                "https://github.com/gyan-media/daily-carousel-media) github-actions-fetch")
          ok = re.compile(r"^https://upload\.wikimedia\.org/wikipedia/commons/[\w%./()~,'!-]+$")
          out = pathlib.Path("fetch/files"); out.mkdir(parents=True, exist_ok=True)
          report = []
          for req in sorted(pathlib.Path("fetch/requests").glob("*.txt")):
              for url in req.read_text().split():
                  name = hashlib.sha256(url.encode()).hexdigest()[:20]
                  dest = out / name
                  if dest.exists() or not ok.match(url):
                      report.append(f"{'have' if dest.exists() else 'refused'} {url}"); continue
                  for wait in (0, 5, 20, None):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=60) as r:
                              data = r.read(40_000_000)
                          if len(data) > 1000:
                              dest.write_bytes(data); report.append(f"ok {len(data)} {url}"); break
                      except Exception as e:
                          report.append(f"retry {getattr(e, 'code', e)} {url}")
                      if wait is None:
                          (out / (name + ".failed")).write_text(report[-1]); break
                      time.sleep(wait)
              req.unlink()
          print("\n".join(report))
          PY
      - name: Push the files
        run: |
          git config user.name "attention-bot"; git config user.email "bot@attention.daily"
          git add -A fetch
          git diff --cached --quiet && exit 0
          git commit -m "fetched photos"
          for i in 1 2 3 4; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep 3; done
          exit 1
